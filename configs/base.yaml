# 所有运行配置的共享块。p0.yaml / batch.yaml 通过 `extends: base.yaml` 继承，
# 只需写各自的差异项（load_config 做递归合并，子配置优先）。
#
# 路径均为相对仓库根目录，由 nusc_inject.config.load_config 统一解析为绝对路径；
# 数据目录布局见 README「数据准备」。

dataset:
  root: data/nuscenes
  version: v1.0-mini
  lidar_channel: LIDAR_TOP
  cam_channels: [CAM_FRONT, CAM_FRONT_LEFT, CAM_FRONT_RIGHT, CAM_BACK, CAM_BACK_LEFT, CAM_BACK_RIGHT]

mesh_points:
  n_dense: 300000
  n_lidar: 12000

lidar_channel:
  range_image:
    H: 512
    W: 2048
    elev_min_deg: -30.67
    elev_max_deg: 10.67
  range_max_m: 80.0
  out_format: n5          # n5 = native nuScenes (N,5); n4 = KITTI-style (N,4)

camera_channel:
  engine: CYCLES          # CYCLES | BLENDER_EEVEE | WORKBENCH（传给 Blender）
  cycles_device: CPU      # CPU | GPU（仅 CYCLES 生效）
  cycles_samples: 64
  frustum_margin_px: 40
  # 光照固定为「白色世界 + 单太阳」，不提供配置项——遮挡判定与内参自检
  # 需要可复现的图像，不允许每次运行变化。

composite:
  alpha_threshold: 0.05
  depth_margin_m: 0.2     # constant slack: calibration / extrinsics error
  depth_margin_rel: 0.02  # range-proportional slack: sparse-depth error grows
                          # with distance (a fixed margin would be 10% of the
                          # depth at 5 m yet negligible at 60 m)

# dense scene occluder bodies from nuScenes sample_annotation boxes:
# fill the holes of the sparse LiDAR depth (glass / no-return surfaces) so
# near vehicles correctly occlude injected objects in both channels.
scene_occluders:
  enabled: true
  n_per_face: 64          # samples per box face (6 faces -> 6*n_per_face pts)
  scale: 1.0              # shrink boxes slightly (<1) to avoid over-occlusion
  max_dist_m: 60.0        # ignore annotation boxes farther than this
  min_visibility: 1       # visibility_token >= 1 (all annotated boxes)
  spacing_m: 0.15         # LiDAR bin gap-fill: dilate each return by this arc
                          # length at its own range (fills no-return surfaces)
  scene_gap_fill_deg: 0.7 # ANGULAR radius for RAW scene returns, both channels.
                          # nuScenes LIDAR_TOP is a VLP-32: 32 beams over ~1.33°,
                          # while the range image has 512 rows at 0.081°. A
                          # constant metric radius cannot bridge that gap at
                          # every range (it grows with distance), so the fill is
                          # angular. 0.7° ≈ half the beam spacing — the minimum
                          # that closes it. Raise for coarser sensors.

blender:
  binary: tools/blender/blender
  selfcheck_max_pixel_err: 2.0

validation:
  min_coverage: 0.85
  min_bbox_iou: 0.5
  min_alpha_px: 500
  require_num_lidar_pts_gt0: true
  min_size_m: 0.05        # reject degenerate / absurd gt sizes (longest edge)
  max_size_m: 40.0
