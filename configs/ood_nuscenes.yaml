# ood_nuscenes —— 严格 OOD 第三方材质随机注入全量 mini 并导出。
#
# 口径（详见 plans/ood_nuscenes_plan.md）：
#   * 模型池 = road_ood_asset_tags.csv 中 tier == "OOD"（nuScenes 23 类税则之外，
#     不含 ID-TAIL 灰区）—— 由 models_from 在 load_config 时展开成 models 池
#   * tracking 跨帧轨迹：每 scene 2 条，世界系静止、prev/next 链式标注
#   * Cycles GPU（OPTIX -> CUDA -> CPU 自动回退，实际设备打在 blender_render.log）
#   * 类目固定 movable_object.anomaly（asset_tags.ood_category 同值）
# 共享块见 configs/base.yaml。

extends: base.yaml

run_id: ood_nuscenes_v1
output_dir: data/outputs/OoD

dataset:
  # null = all scenes（v1.0-mini：10 scenes / 404 关键帧）
  scenes: null

models_from:
  tags_csv: assets/models/road_ood_docum/road_ood_asset_tags.csv
  filter: { tier: OOD }
  defaults:
    albedo: 0.6
    intensity_gain_k: 200.0
    category: movable_object.anomaly
  # target_max_dim_m（缩放后最长边，米）——常识性体积检查：
  # size_by_class 按类目现实尺寸先验精确控制（灭火器不会因同组允许而长到
  # 3m、塑料袋不会成 3m）；表外类目回退 size_by_group，再回退 default_size。
  size_by_class:
    # ---- 非典型交通参与者 ----
    boat:             [1.5, 4.0]
    canoe:            [2.5, 5.0]
    golfcart:         [2.0, 3.0]
    horse_buggy:      [2.0, 3.5]
    horse_carriage:   [2.5, 4.0]
    kayak:            [2.5, 4.0]
    sled:             [1.0, 2.5]
    snowmobile:       [1.5, 2.5]
    surfboard:        [1.5, 2.5]
    # ---- 施工 / 工业 ----
    generator:                [0.8, 2.5]
    lawn_mower:               [0.8, 1.8]
    plow_(farm_equipment):    [1.5, 3.5]
    tractor_(farm_equipment): [2.5, 4.5]
    # ---- 遗撒物 / 杂物 ----
    armoire:          [1.5, 2.4]
    automatic_washer: [0.6, 1.2]
    bathtub:          [1.5, 2.0]
    bed:              [1.9, 2.2]
    bookcase:         [1.5, 2.4]
    cabinet:          [1.0, 2.2]
    plastic_bag:      [0.3, 0.8]
    refrigerator:     [1.4, 2.2]
    sink:             [0.5, 1.2]
    sofa:             [1.8, 3.0]
    table:            [1.0, 2.4]
    toilet:           [0.5, 0.8]
    # ---- 道路设施 ----
    awning:           [1.5, 4.0]
    bench:            [1.2, 2.5]
    billboard:        [2.0, 4.0]
    chair:            [0.6, 1.3]
    fire_alarm:       [0.2, 0.5]
    fire_extinguisher: [0.4, 0.7]
    fireplug:         [0.6, 1.0]
    flagpole:         [2.0, 4.0]
    garbage:          [0.3, 0.8]
    lamppost:         [3.0, 6.0]
    mail_slot:        [0.2, 0.5]
    mailbox_(at_home): [0.5, 1.2]
    manhole:          [0.5, 0.8]
    milestone:        [0.3, 0.8]
    newsstand:        [1.0, 2.5]
    parking_meter:    [0.8, 1.3]
    pole:             [2.0, 5.0]
    postbox_(public): [0.9, 1.6]
    signboard:        [0.5, 1.5]
    silo:             [2.5, 5.0]
    stop_sign:        [1.2, 2.2]
    street_sign:      [1.5, 3.0]
    streetlight:      [3.0, 6.0]
    telephone_booth:  [2.0, 3.0]
    telephone_pole:   [4.0, 8.0]
  # 表外类目的分组回退（严格 OOD 50 类已全部列在 size_by_class）
  size_by_group:
    animals:         [0.4, 2.0]
    dropped_items:   [0.4, 3.0]
    road_facilities: [0.5, 3.5]
    atypical_actors: [0.8, 3.0]
    construction:    [1.5, 5.0]
  default_size: [0.5, 3.0]

objects:
  count: 2                            # tracks per scene
  strategy: random_forward
  forward_range_m: [8.0, 30.0]
  lateral_range_m: [-4.0, 4.0]
  yaw_in_ego_deg_range: [0.0, 360.0]
  pitch_in_ego_deg_range: [0.0, 0.0]
  roll_in_ego_deg_range: [0.0, 0.0]
  min_spacing_m: 6.0
  ground:
    search_radius_m: 4.0
    z_percentile: 15.0
  seed: 42                           # deterministic placements
  tracking:
    enabled: true
    length: [3, 8]
    forward_range_m: [12.0, 35.0]     # start farther so tracks survive longer

camera_channel:
  engine: CYCLES
  cycles_device: GPU                  # RTX 5090：OPTIX -> CUDA -> CPU 回退
  cycles_samples: 64

annotation:
  category_name: movable_object.anomaly
  attribute_name: vehicle.moving
  visibility_token: "4"

validation:
  min_visible_px: 1        # 完全遮挡（所有相机 0 可见命中）的目标不绘制、不标注
  min_obj_camera_dist_m: 4.0  # 车驶近到 4m 内的目标该帧跳过（防黑帧糊屏），轨迹终止
  max_size_m: 9.0          # 常识兜底：最长边超 9m 的注入目标直接判失败
                           # （size_by_class 已把 50 类压进现实区间，此为第二道闸）

export_dir: data/exports/ood_nuscenes # 交付物：标准 nuScenes 格式数据集
